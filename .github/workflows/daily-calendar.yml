name: Daily Finance Calendar

on:
  schedule:
    # 0:00 UTC = 8:00 AM Beijing time
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Generate calendar
        run: python run.py calendar --days 30

      - name: Prepare deploy
        run: cp out/calendar.html out/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
